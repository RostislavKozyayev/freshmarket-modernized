<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMarket — Вход в систему</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-header">
            <a href="main.html" class="logo">Fresh<span>Market</span></a>
            <h1>Вход в систему</h1>
        </div>

        <div class="error-message" id="errorMessage" role="alert"></div>

        <form id="loginForm" class="login-form" novalidate>
            <div class="form-group">
                <div class="input-wrapper">
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                    <input type="email" id="email" placeholder="Email" required autocomplete="email" value="user@example.com">
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password" placeholder="Пароль" required autocomplete="current-password" value="123456">
                    <button type="button" class="toggle-password" onclick="togglePassword()">Показать</button>
                </div>
            </div>

            <div class="role-switcher">
                <button type="button" class="role-btn active" data-role="customer" onclick="switchRole('customer')">
                    Покупатель
                </button>
                <button type="button" class="role-btn" data-role="admin" onclick="switchRole('admin')">
                    Администратор
                </button>
            </div>

            <!-- Используем btn-login-submit, чтобы не конфликтовать с nav-кнопкой .btn-login -->
            <button type="submit" class="btn-login-submit">Войти</button>

            <div class="forgot-password" role="button" tabindex="0" onclick="showForgotPassword()">
                Забыли пароль?
            </div>
        </form>

        <div class="register-link">
            Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
        </div>
    </div>

    <script>
        let currentRole = 'customer';

        function switchRole(role) {
            currentRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.role === role);
            });
            document.getElementById('email').value =
                role === 'admin' ? 'admin@freshmarket.ru' : 'user@example.com';
        }

        function togglePassword() {
            const input  = document.getElementById('password');
            const toggle = document.querySelector('.toggle-password');
            const isText = input.type === 'text';
            input.type       = isText ? 'password' : 'text';
            toggle.textContent = isText ? 'Показать' : 'Скрыть';
        }

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            if (!email || !password) {
                errorDiv.textContent = '⚠️ Введите email и пароль';
                errorDiv.classList.add('show');
                return;
            }
            errorDiv.classList.remove('show');

            localStorage.setItem('userRole',   currentRole);
            localStorage.setItem('userEmail',  email);
            localStorage.setItem('isLoggedIn', 'true');

            window.location.href = currentRole === 'admin' ? 'admin.html' : 'main.html';
        });

        function showForgotPassword() {
            alert(
                'Функция восстановления пароля будет реализована в следующей версии.\n\n' +
                'Для входа используйте:\n' +
                '👤 Покупатель: любой email / пароль\n' +
                '🔧 Админ: admin@freshmarket.ru / admin123'
            );
        }

        // Если уже авторизован — перенаправляем
        window.addEventListener('DOMContentLoaded', function () {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                window.location.href =
                    localStorage.getItem('userRole') === 'admin' ? 'admin.html' : 'main.html';
            }
        });
    </script>
</body>
</html>
