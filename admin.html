<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMarket — Административная панель</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="admin-page">
    <div class="admin-container">
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <a href="main.html">FreshMarket</a>
            </div>
            <nav class="admin-nav">
                <button class="admin-nav-item active" onclick="showSection('products')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <rect x="3"  y="3"  width="7" height="7"/>
                        <rect x="14" y="3"  width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3"  y="14" width="7" height="7"/>
                    </svg>
                    Товары
                </button>
                <button class="admin-nav-item" onclick="showSection('orders')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                    </svg>
                    Заказы
                </button>
                <button class="admin-nav-item" onclick="logout()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Выход
                </button>
            </nav>
        </aside>

        <!-- Mobile bottom tab bar (visible only on small screens) -->
        <nav class="admin-mobile-tabs" id="adminMobileTabs">
            <button class="admin-tab-btn active" onclick="showSection('products')" data-section="products">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="3"  y="3"  width="7" height="7"/>
                    <rect x="14" y="3"  width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3"  y="14" width="7" height="7"/>
                </svg>
                <span>Товары</span>
            </button>
            <button class="admin-tab-btn" onclick="showSection('orders')" data-section="orders">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                <span>Заказы</span>
            </button>
            <button class="admin-tab-btn" onclick="logout()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>Выход</span>
            </button>
        </nav>

        <main class="admin-main">
            <div class="admin-header">
                <h1>Административная панель</h1>
            </div>

            <!-- Статистика -->
            <div class="admin-stats">
                <div class="stat-card">
                    <div class="stat-label">Всего товаров</div>
                    <div class="stat-value" id="totalProducts">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Заказов сегодня</div>
                    <div class="stat-value" id="totalOrders">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Выручка</div>
                    <div class="stat-value" id="totalRevenue">—</div>
                </div>
            </div>

            <!-- Секция товаров -->
            <section class="section active" id="productsSection">
                <div class="section-header">
                    <h2>Управление товарами</h2>
                    <button class="btn-add-admin" onclick="addProduct()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5"  y1="12" x2="19" y2="12"/>
                        </svg>
                        Добавить товар
                    </button>
                </div>
                <div class="table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Товар</th>
                                <th>Цена</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody"></tbody>
                    </table>
                </div>
            </section>

            <!-- Секция заказов -->
            <section class="section" id="ordersSection">
                <div class="section-header">
                    <h2>Заказы</h2>
                </div>
                <div class="table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>№ Заказа</th>
                                <th>Клиент</th>
                                <th>Сумма</th>
                                <th>Статус</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script>
        /* ===== AUTH CHECK ===== */
        window.addEventListener('DOMContentLoaded', function () {
            if (localStorage.getItem('isLoggedIn') !== 'true' ||
                localStorage.getItem('userRole')   !== 'admin') {
                window.location.href = 'login.html';
                return;
            }
            renderProducts();
            renderOrders();
        });

        /* ===== SECTION SWITCHING ===== */
        function showSection(name) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.admin-nav-item').forEach(n => n.classList.remove('active'));
            document.querySelectorAll('.admin-tab-btn[data-section]').forEach(n => n.classList.remove('active'));

            document.getElementById(name + 'Section').classList.add('active');

            // Sidebar
            const navItems = document.querySelectorAll('.admin-nav-item');
            if (name === 'products') navItems[0].classList.add('active');
            if (name === 'orders')   navItems[1].classList.add('active');

            // Mobile tabs
            const tab = document.querySelector(`.admin-tab-btn[data-section="${name}"]`);
            if (tab) tab.classList.add('active');
        }

        /* ===== PRODUCTS ===== */
        function getProducts() {
            return JSON.parse(localStorage.getItem('products')) || [
                { id: 1, name: 'Молоко 3.2%',    price: 89,  emoji: '🥛' },
                { id: 2, name: 'Хлеб злаковый',   price: 55,  emoji: '🍞' },
                { id: 3, name: 'Яблоки Гала',      price: 120, emoji: '🍎' },
                { id: 4, name: 'Сыр Пармезан',     price: 250, emoji: '🧀' },
            ];
        }

        function saveProducts(products) {
            localStorage.setItem('products', JSON.stringify(products));
        }

        function renderProducts() {
            const products = getProducts();
            const tbody    = document.getElementById('productsTableBody');

            tbody.innerHTML = products.map(p => `
                <tr>
                    <td>
                        <div class="product-cell">
                            <div class="product-emoji">${p.emoji}</div>
                            <strong class="product-name">${p.name}</strong>
                        </div>
                    </td>
                    <td>${p.price} ₽</td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn edit"   onclick="editProduct(${p.id})">Изменить</button>
                            <button class="action-btn delete" onclick="deleteProduct(${p.id})">Удалить</button>
                        </div>
                    </td>
                </tr>
            `).join('');

            document.getElementById('totalProducts').textContent = products.length;
        }

        function addProduct() {
            const name  = prompt('Название товара:');
            if (!name) return;
            const price = parseFloat(prompt('Цена (₽):'));
            if (isNaN(price) || price < 0) { alert('Некорректная цена!'); return; }
            const emoji = prompt('Эмодзи (например 🍎):', '📦') || '📦';

            const products = getProducts();
            products.push({ id: Date.now(), name: name.trim(), price, emoji });
            saveProducts(products);
            renderProducts();
            alert('✅ Товар добавлен!');
        }

        function editProduct(id) {
            const products = getProducts();
            const product  = products.find(p => p.id === id);
            if (!product) return;

            const newName  = prompt('Новое название:', product.name);
            if (!newName) return;
            const newPrice = parseFloat(prompt('Новая цена:', product.price));
            if (isNaN(newPrice) || newPrice < 0) { alert('Некорректная цена!'); return; }

            product.name  = newName.trim();
            product.price = newPrice;
            saveProducts(products);
            renderProducts();
            alert('✅ Товар обновлён!');
        }

        function deleteProduct(id) {
            if (!confirm('Удалить товар?')) return;
            const products = getProducts().filter(p => p.id !== id);
            saveProducts(products);
            renderProducts();
            alert('✅ Товар удалён!');
        }

        /* ===== ORDERS ===== */
        function renderOrders() {
            const orders = JSON.parse(localStorage.getItem('orders')) || [
                { id: 1001, client: 'Иванов И.И.',  total: 1250, status: 'Новый'       },
                { id: 1002, client: 'Петрова А.С.', total: 890,  status: 'В обработке' },
            ];

            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = orders.map(o => `
                <tr>
                    <td>#${o.id}</td>
                    <td>${o.client}</td>
                    <td>${o.total} ₽</td>
                    <td><span style="color:var(--primary);font-weight:600;">${o.status}</span></td>
                </tr>
            `).join('');

            document.getElementById('totalOrders').textContent  = orders.length;
            document.getElementById('totalRevenue').textContent =
                orders.reduce((s, o) => s + o.total, 0).toLocaleString('ru-RU') + ' ₽';
        }

        /* ===== LOGOUT ===== */
        function logout() {
            localStorage.removeItem('userRole');
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userEmail');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
