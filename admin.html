<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMarket — Административная панель</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
    <div class="admin-container">
        <!-- Боковая панель -->
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <a href="main.html">FreshMarket</a>
            </div>
            <nav class="admin-nav">
                <button class="admin-nav-item active" data-section="products" onclick="showAdminSection('products')">
                    📦 Товары
                </button>
                <button class="admin-nav-item" data-section="orders" onclick="showAdminSection('orders')">
                    🛒 Заказы
                </button>
                <button class="admin-nav-item" onclick="logout()">
                    🚪 Выход
                </button>
            </nav>
        </aside>

        <!-- Основной контент -->
        <main class="admin-main">
            <div class="admin-header">
                <h1>Административная панель</h1>
            </div>

            <!-- Статистика -->
            <div class="admin-stats">
                <div class="stat-card">
                    <div class="stat-label">Всего товаров</div>
                    <div class="stat-value" id="totalProducts">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Заказов сегодня</div>
                    <div class="stat-value" id="todayOrders">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Выручка</div>
                    <div class="stat-value" id="revenue">—</div>
                </div>
            </div>

            <!-- Секция товаров -->
            <div id="productsSection" class="admin-section section active">
                <div class="section-header">
                    <h2>Управление товарами</h2>
                    <button class="btn-add-admin" onclick="openAddProductModal()">+ Добавить товар</button>
                </div>
                <div class="table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Товар</th>
                                <th>Цена</th>
                                <th>Наличие</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <!-- Данные загружаются через JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Секция заказов -->
            <div id="ordersSection" class="admin-section section" style="display:none;">
                <div class="section-header">
                    <h2>Управление заказами</h2>
                </div>
                <div class="table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>№ Заказа</th>
                                <th>Клиент</th>
                                <th>Сумма</th>
                                <th>Статус</th>
                                <th>Дата</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <!-- Данные загружаются через JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Мобильная навигация -->
    <nav class="admin-mobile-tabs">
        <button class="admin-tab-btn active" data-section="products" onclick="showAdminSection('products')">
            <span>📦</span>
            <span>Товары</span>
        </button>
        <button class="admin-tab-btn" data-section="orders" onclick="showAdminSection('orders')">
            <span>🛒</span>
            <span>Заказы</span>
        </button>
        <button class="admin-tab-btn" onclick="logout()">
            <span>🚪</span>
            <span>Выход</span>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
